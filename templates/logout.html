<style>
    .custom-a {
        text-decoration: none;
        color: rgb(255, 255, 255);
    }

    .custom-a:hover {
        text-decoration: none;
        color: rgb(0, 0, 0);
    }

    body{
        background-image: url(https://img.freepik.com/vettori-gratuito/moderno-disegno-di-sfondo-in-acquerello-verde-morbido_1055-20919.jpg?semt=ais_hybrid&w=740&q=80);
        background-size: cover;
    }
</style>

<html>
<head>
    <title>Account | Novariso</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    
<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-dark fixed-top shadow-lg">
    <div class="container-fluid d-flex align-items-center justify-content-between">

        <div class="d-flex align-items-center">
            {% if current_user.is_authenticated %}
                <a>
                    <img src="{{current_user.logo}}"
                         class="rounded-circle"
                         width="42"
                         height="42">
                </a>
            {% endif %}
        </div>

        <div class="text-center flex-grow-1">
            <span class="navbar-brand mx-auto text-white font-weight-bold">
                Account Personale
            </span>
        </div>

        <div class="d-flex align-items-center">
            {% if current_user.is_authenticated %}
                <a href="/">
                    <img src="https://img.freepik.com/vettori-premium/simbolo-della-home-page-dell-icona-per-il-sito-web_414847-462.jpg"
                         class="rounded-circle"
                         width="42"
                         height="42">
                </a>
            {% endif %}
        </div>

    </div>
</nav>
</head>

<body>

<div class="container-fluid">
    <div class="row mt-5 pt-4">
        <!-- Sidebar -->
        <div class="col-12 col-md-3 col-lg-2 mb-3">
            <div class="card glass" style="background-color: rgba(89, 86, 86, 0.5);">
                <div class="card-body">
                    <a href="/account" class="custom-a d-block mb-2">Su di me</a><hr>
                    <a href="/security" class="custom-a d-block mb-2">Privacy e Sicurezza</a><hr>
                    <a href="/danger" class="custom-a d-block mb-2">Delete Account</a><hr>
                    <a href="/termini_di_servizio" class="custom-a d-block mb-2">Termini di Servizio</a><hr>
                </div>
            </div>
        </div>
        <!-- Main content -->
        <div class="col-12 col-md-9 col-lg-10 mb-3">
            <div class="card bg-white bg-opacity-25 border-0">
                <div class="card-body" style="background-color: rgba(89, 86, 86, 0.5);">
                    <h4 class="text-center text-white">Logout</h4>
                    <hr class="mx-auto" style="width: 80%; color: white;">
                    <div class="d-flex justify-content-center">
                        <div class="card bg-white border-0 p-3 w-100 w-md-75 w-lg-50">
                            <div class="text-center mt-4 mb-4">
                                <p class="fw-bold text-secondary">Vuoi uscire dall'Account?</p>
                                <button id="logoutBtn" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#delAccountModal">Logout</button>
                            </div>

                            <!-- Modal -->
                            <div class="modal fade" id="delAccountModal" tabindex="-1" aria-labelledby="delAccountModalLabel" aria-hidden="true">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/scripts/JS/blockinspect.js"></script>
<script>
document.getElementById("logoutBtn").addEventListener("click", function() {
    // Reindirizza al server per eseguire il logout
    window.location.href = "/login";
});
</script>
</body>
</html>
