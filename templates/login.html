<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novariso | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
    <section class="vh-100 bg-image" style="background-color: #36393F;">
        <div class="mask d-flex align-items-center h-100 gradient-custom-3">
            <div class="container h-100">
                <div class="row d-flex justify-content-center align-items-center h-100">
                    <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                        <div class="card" style="border-radius: 15px;">
                            <div class="card-body p-5">
                                <h2 class="text-uppercase text-center mb-5">Accedi</h2>

                                <!-- FORM LOGIN -->
                                <form id="loginForm">
                                    <div class="form-outline mb-4">
                                        <input type="text" name="name" id="nome_utente" class="form-control form-control-lg" placeholder="Email o Username" required />
                                    </div>

                                    <div class="form-outline mb-4">
                                        <div class="input-group input-group-lg">
                                            <input type="password" name="password" id="password" class="form-control" placeholder="Password" required />
                                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-center">
                                        <button type="submit" class="btn btn-success btn-block btn-lg gradient-custom-4 text-body">
                                            Log In
                                        </button>
                                    </div>
                                </form>

                                <p class="text-center text-muted mt-5 mb-0">
                                    Non hai ancora un Account? 
                                    <a href="/register" class="fw-bold text-body"><u>Registrati qui!</u></a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

	<!-- Login Error Modal -->
	<div class="modal fade" id="loginErrorModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title">Errore login</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<p id="loginErrorText"></p>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" id="loginErrorButton">Ok</button>
				</div>
			</div>
		</div>
	</div>


    <!-- JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/scripts/JS/blockinspect.js"></script>

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = "password";
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>

    <script>
		$('#loginForm').submit(function(e) {
			e.preventDefault();

			$.ajax({
				url: '/login',
				type: 'POST',
				data: {
					name: $('#nome_utente').val(),
					password: $('#password').val()
				},
				dataType: 'json',
				success: function(data) {
					if (data.result === "success") {
						window.location.href = '/';
					} else {
						const modalEl = $('#loginErrorModal');
						$('#loginErrorText').text(data.popup_text || data.error_text);
						const modal = new bootstrap.Modal(modalEl[0]);
						modal.show();

						$('#loginErrorButton').off('click').on('click', function() {
							modal.hide();
							if (data.redirect) {
								window.location.href = data.redirect;
							}
						});
					}
				},
				error: function(err) {
					console.error("Errore nella richiesta AJAX:", err);
					alert("Errore nel server, riprova più tardi.");
				}
			});
		});

    </script>
</body>
</html>
