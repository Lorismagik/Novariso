<h2 class="text-center text-black">Il tuo Carrello</h2>

<br>

<div class="container">
    <div class="card card-custom shadow-lg">
        <div class="card-body">

            <!-- LISTA CARRELLO -->
            <div id="lista-carrello"></div>

            <!-- TOTALE PREZZO -->

            <!-- PULSANTE CHECKOUT -->

    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
<script src="/static/scripts/JS/blockinspect.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.add("loaded");

    const carrello = JSON.parse(localStorage.getItem("carrello")) || [];
    const lista = document.getElementById("lista-carrello");
    const checkoutBtn = document.getElementById("checkout-btn");
    const totalePrezzoDiv = document.getElementById("totale-prezzo");

    lista.innerHTML = "";
    totalePrezzoDiv.innerHTML = "";

    if (carrello.length === 0) {
        lista.innerHTML = `
            <p class="text-center text-muted my-4">
                Nessun prodotto nel carrello
            </p>
        `;
        checkoutBtn.style.display = "none";
        return;
    }

    // Calcolo totale
    let totale = 0;
    carrello.forEach(prodotto => {
        totale += prodotto.prezzo * prodotto.quantita;
    });

    // Mostra totale con 2 decimali e simbolo €
    totalePrezzoDiv.innerHTML = `Totale: €${totale.toFixed(2)}`;

    checkoutBtn.style.display = "block";

    // Aggiungi click al pulsante "Procedi al pagamento"
    checkoutBtn.querySelector("a").addEventListener("click", function(event){
        event.preventDefault(); // blocca navigazione
        // svuota carrello
        localStorage.setItem("carrello", JSON.stringify([]));
        // mostra modal
        $('#acquistoModal').modal('show');
        // aggiorna lista e totale
        lista.innerHTML = `<p class="text-center text-muted my-4">Nessun prodotto nel carrello</p>`;
        totalePrezzoDiv.innerHTML = "";
        checkoutBtn.style.display = "none";
    });

    carrello.forEach((prodotto, index) => {
        lista.innerHTML += `
            <div class="container p-3 bg-white rounded shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="text-center flex-fill">
                        <h4>${prodotto.nome}</h4>
                    </div>
                    <div class="col-md-2 text-center">
                        <input type="number"
                               class="form-control"
                               min="1"
                               value="${prodotto.quantita}"
                               onchange="aggiornaQuantita(${index}, this.value)">
                    </div>
                    <div class="col-md-2 text-center">
                        €${(prodotto.prezzo * prodotto.quantita).toFixed(2)}
                    </div>
                    <div class="col-md-2 text-center">
                        <button class="btn btn-outline-danger btn-sm"
                                onclick="rimuoviProdotto(${index})">
                            Rimuovi
                        </button>
                    </div>
                </div>
            </div>
        `;
    });
});

    // Calcolo totale
    let totale = 0;
    carrello.forEach(prodotto => {
        totale += prodotto.prezzo * prodotto.quantita;
    });

    // Mostra totale con 2 decimali e simbolo €
    totalePrezzoDiv.innerHTML = `Totale: €${totale.toFixed(2)}`;

    checkoutBtn.style.display = "block";

    carrello.forEach((prodotto, index) => {
        lista.innerHTML += `
            <div class="container p-3 bg-white rounded shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="text-center flex-fill">
                        <h4>${prodotto.nome}</h4>
                    </div>
                    <div class="col-md-2 text-center">
                        <input type="number"
                               class="form-control"
                               min="1"
                               value="${prodotto.quantita}"
                               onchange="aggiornaQuantita(${index}, this.value)">
                    </div>
                    <div class="col-md-2 text-center">
                        €${(prodotto.prezzo * prodotto.quantita).toFixed(2)}
                    </div>
                    <div class="col-md-2 text-center">
                        <button class="btn btn-outline-danger btn-sm"
                                onclick="rimuoviProdotto(${index})">
                            Rimuovi
                        </button>
                    </div>
                </div>
            </div>
        `;
    });

function rimuoviProdotto(index) {
    let carrello = JSON.parse(localStorage.getItem("carrello")) || [];
    carrello.splice(index, 1);
    localStorage.setItem("carrello", JSON.stringify(carrello));
    location.reload();
}

function aggiornaQuantita(index, nuovaQuantita) {
    let carrello = JSON.parse(localStorage.getItem("carrello")) || [];
    carrello[index].quantita = parseInt(nuovaQuantita);
    localStorage.setItem("carrello", JSON.stringify(carrello));
    location.reload();
}
</script>
<!-- MODAL ACQUISTO EFFETTUATO -->
<div class="modal fade" id="acquistoModal" tabindex="-1" role="dialog" aria-labelledby="acquistoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="acquistoModalLabel">Acquisto Effettuato!</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Chiudi">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        Grazie per il tuo acquisto!
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-success" data-dismiss="modal">Chiudi</button>
      </div>
    </div>
  </div>
</div>
