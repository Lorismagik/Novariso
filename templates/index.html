<!DOCTYPE html>
<html lang="it">

<head>
    <title>Novariso Shop</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">

    <style>
        body {
            opacity: 0;
            transition: opacity 1s ease;
            background-image: url(https://img.freepik.com/vettori-gratuito/moderno-disegno-di-sfondo-in-acquerello-verde-morbido_1055-20919.jpg?semt=ais_hybrid&w=740&q=80);
            background-size: cover;
        }

        body.loaded {
            opacity: 1;
        }

        .hover-custom-leo {
            transition: transform 0.3s;
        }

        .hover-custom-leo:hover {
            transform: scale(1.1);
        }

        .foot {
            background-color: rgba(255, 255, 255, 0.411);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        .custom {
            text-decoration: none;
            color: rgb(255, 255, 255);
        }

        .custom:hover {
            text-decoration: none;
            color: rgb(97, 97, 97);
        }

        .center-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        /* Carousel immagini altezza fissa, larghezza adattabile */
        .carousel-item img {
            height: 300px;
            object-fit: cover;
            width: 100%;
        }

		/* Frecce di navigazione nere */
		.carousel-control-prev-icon,
		.carousel-control-next-icon {
			background-color: transparent !important; /* niente sfondo */
			filter: invert(0%) sepia(100%) saturate(0%) hue-rotate(0deg) brightness(0) contrast(100%);
			/* questa combinazione trasforma il bianco in nero */
			width: 20px;
			height: 35px;
		}

		.carousel-control-prev-icon {
			clip-path: polygon(0% 50%, 100% 0%, 100% 100%);
		}

		.carousel-control-next-icon {
			clip-path: polygon(100% 50%, 0% 0%, 0% 100%);
		}

		/* Indicatori (trattini neri) */
		.carousel-indicators li {
			width: 30px;          /* più largo per fare lineetta */
			height: 4px;          /* basso per una linea sottile */
			border-radius: 0;     /* togli arrotondamenti */
			background-color: black !important;
			border: none !important; /* rimuovi bordo */
			margin: 0 5px;        /* un po' di spazio tra lineette */
			transition: background-color 0.3s ease;
		}

		.carousel-indicators li.active {
			background-color: black !important;
		}
    </style>

		<!--NAVBAR BEGIN-->
		<nav class="navbar navbar-expand-lg navbar-dark navbar-shadow shadow-lg" style="background-color: rgba(2, 255, 179, 0.325);">
        <a class="navbar-brand">
            <img class="rounded-circle shadow-4-strong" height="40" width="40" src="{{ url_for('serve_logo', filename='logo.jpeg') }}" />
        </a>

			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">

                <li class="nav-item active hover-custom-leo">
                    <a class="nav-link" href="/prodotti" style="color: black;">I Nostri Prodotti</a>
                </li>

                <li class="nav-item active hover-custom-leo">
                    <a class="nav-link" href="/chi_siamo" style="color: black;">Chi Siamo</a>
                </li>

                <li class="nav-item active hover-custom-leo">
                    <a class="nav-link" href="/issues" style="color: black;">FAQ</a>
                </li>

                <li class="nav-item active hover-custom-leo">
					<a class="nav-link" href="/olio" style="color: black;">Il Nostro Olio</a>
				</li>

                <li class="nav-item active hover-custom-leo">
                    <a class="nav-link" href="/carrello" style="color: black;">Carrello</a>
                </li>
            </ul>

            <a class="navbar-brand" href="/account">
                <img class="rounded-circle shadow-4-strong" style="margin-left: 1550px;" height="40" width="40"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9zDcfuhkyr5Ek9YTfeuna7OCS3rrLqtc2cQ&s" />
            </a>
        </div>
    </nav>
</head>

<body>
    <br>
    <br>
    <br>
    <div class="center-logo-container">
        <a class="navbar-brand">
            <img class="shadow-4-strong" height="200" width="200"
                src="{{url_for('serve_images', filename='logo_bianco.jpeg') }}" />
        </a>
    </div>
    <br>
    <br>
    <br>

    <div class="col d-flex flex-column align-items-center">

        <!-- Carousel Bootstrap -->
        <div id="carouselExampleIndicators" class="carousel slide" style="width: 400px; height: 300px;"
            data-ride="carousel">
            <ol class="carousel-indicators">
                <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
                <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
                <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
            </ol>

            <div class="carousel-inner rounded shadow-lg">
                <div class="carousel-item active">
                    <img src="{{ url_for('serve_images', filename='fondente.jpeg') }}" class="d-block w-100" alt="Foto 1">
                </div>
                <div class="carousel-item">
                    <img src="{{ url_for('serve_images', filename='mela.jpeg') }}" class="d-block w-100" alt="Foto 2">
                </div>
                <div class="carousel-item">
                    <img src="{{ url_for('serve_images', filename='cioccolato.jpeg') }}" class="d-block w-100"
                        alt="Foto 3">
                </div>
            </div>

            <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Precedente</span>
            </a>
            <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Successivo</span>
            </a>
        </div>

        <br>
        <br>

        <!-- Bottone scopri di più -->
        <a href="/prodotti" class="btn btn-primary mt-4 px-5 py-2 shadow-lg"
            style="font-weight: 600; font-size: 1.2rem;">
            Scopri di più
        </a>

    </div>

    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>

    <!-- Footer -->
    <footer class="text-center text-lg-start shadow-lg mt-5" style="background-color: rgba(2, 255, 179, 0.325);">
        <div class="foot" style="color: black;">
            <a href="/termini_di_servizio" class="custom" id="copyright" style="color: black;">
                © 2026 Copyright
            </a> <br>
            Novariso Shop
        </div>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js"></script>
    <script src="/static/scripts/JS/blockinspect.js"></script>

    <script>
        // Transizione iniziale
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelector('body').classList.add('loaded');
        });

        $('#goto-solar').click(function (e) {
            e.preventDefault();

            $('html').fadeOut(1000, function () {
                window.location.href = "/solar"
            });
        });
    </script>

</body>

</html>
